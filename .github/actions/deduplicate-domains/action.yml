name: Deduplicate Domains
description: Remove redundant domains and finalize domain lists

inputs:
  config-dir:
    description: Directory containing sources.json config
    required: false
    default: ${{ github.workspace }}/.github/config
  work-dir:
    description: Working directory for processing
    required: false
    default: ${{ github.workspace }}
  custom-data-dir:
    description: Path to domain-list-community data directory
    required: false
    default: ${{ github.workspace }}/community/data
  hidden-data-dir:
    description: Path to hidden branch data directory
    required: false
    default: ${{ github.workspace }}/hidden-data

outputs:
  direct-count:
    description: Final count of direct domains
    value: ${{ steps.finalize.outputs.direct-count }}
  proxy-count:
    description: Final count of proxy domains
    value: ${{ steps.finalize.outputs.proxy-count }}
  reject-count:
    description: Final count of reject domains
    value: ${{ steps.finalize.outputs.reject-count }}

runs:
  using: composite
  steps:
    - name: Load common functions
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        source "${{ github.workspace }}/.github/scripts/common.sh" || true

    - id: deduplicate
      name: Remove redundant domains
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        if [[ ! -f "${{ github.workspace }}/.github/scripts/common.sh" ]]; then
          echo "ERROR: Common functions file not found at ${{ github.workspace }}/.github/scripts/common.sh" >&2
          exit 1
        fi
        source "${{ github.workspace }}/.github/scripts/common.sh"
        
        # Validate working directory exists
        WORK_DIR="${{ inputs.work-dir }}"
        if [[ ! -d "$WORK_DIR" ]]; then
          echo "ERROR: Working directory '$WORK_DIR' does not exist" >&2
          exit 1
        fi
        cd "$WORK_DIR"

         # Merge hidden branch overrides
         if [ -f "${{ inputs.hidden-data-dir }}/proxy.txt" ]; then
           cat "${{ inputs.hidden-data-dir }}/proxy.txt" >> "temp-proxy.txt" || {
             echo "ERROR: Failed to merge proxy.txt from hidden branch" >&2
             exit 1
           }
         fi
         if [ -f "${{ inputs.hidden-data-dir }}/direct.txt" ]; then
           cat "${{ inputs.hidden-data-dir }}/direct.txt" >> "temp-direct.txt" || {
             echo "ERROR: Failed to merge direct.txt from hidden branch" >&2
             exit 1
           }
         fi
         if [ -f "${{ inputs.hidden-data-dir }}/reject.txt" ]; then
           cat "${{ inputs.hidden-data-dir }}/reject.txt" >> "temp-reject.txt" || {
             echo "ERROR: Failed to merge reject.txt from hidden branch" >&2
             exit 1
           }
         fi

         # Sort and deduplicate
         sort_unique "temp-proxy.txt" "proxy-list-with-redundant" || {
           echo "ERROR: Failed to sort and deduplicate proxy domains" >&2
           exit 1
         }
         sort_unique "temp-direct.txt" "direct-list-with-redundant" || {
           echo "ERROR: Failed to sort and deduplicate direct domains" >&2
           exit 1
         }
         sort_unique "temp-reject.txt" "reject-list-with-redundant" || {
           echo "ERROR: Failed to sort and deduplicate reject domains" >&2
           exit 1
         }

         # Remove redundant domains
         if [ -f "${{inputs.hidden-data-dir}}/findRedundantDomain.py" ]; then
           cp "${{inputs.hidden-data-dir}}/findRedundantDomain.py" . || {
             echo "ERROR: Failed to copy findRedundantDomain.py" >&2
             exit 1
           }
           chmod +x findRedundantDomain.py || {
             echo "ERROR: Failed to make findRedundantDomain.py executable" >&2
             exit 1
           }
         fi
         ./findRedundantDomain.py ./direct-list-with-redundant ./direct-list-deleted-unsort || {
           echo "ERROR: Failed to remove redundant direct domains" >&2
           exit 1
         }
         ./findRedundantDomain.py ./proxy-list-with-redundant ./proxy-list-deleted-unsort || {
           echo "ERROR: Failed to remove redundant proxy domains" >&2
           exit 1
         }
         ./findRedundantDomain.py ./reject-list-with-redundant ./reject-list-deleted-unsort || {
           echo "ERROR: Failed to remove redundant reject domains" >&2
           exit 1
         }

        [ ! -f "direct-list-deleted-unsort" ] && touch direct-list-deleted-unsort
        [ ! -f "proxy-list-deleted-unsort" ] && touch proxy-list-deleted-unsort
        [ ! -f "reject-list-deleted-unsort" ] && touch reject-list-deleted-unsort

         sort ./direct-list-deleted-unsort > ./direct-list-deleted-sort || {
           echo "ERROR: Failed to sort direct-list-deleted-unsort" >&2
           exit 1
         }
         sort ./proxy-list-deleted-unsort > ./proxy-list-deleted-sort || {
           echo "ERROR: Failed to sort proxy-list-deleted-unsort" >&2
           exit 1
         }
         sort ./reject-list-deleted-unsort > ./reject-list-deleted-sort || {
           echo "ERROR: Failed to sort reject-list-deleted-unsort" >&2
           exit 1
         }

          if [ -f "./direct-list-deleted-sort" ] && [ -f "./direct-list-with-redundant" ]; then
            diff ./direct-list-deleted-sort ./direct-list-with-redundant | awk '/^>/{print $2}' > ./direct-list-without-redundant || {
              # If diff fails or produces no output, use the original file
              cp ./direct-list-with-redundant ./direct-list-without-redundant || {
                echo "ERROR: Failed to create direct-list-without-redundant" >&2
                exit 1
              }
            }
          else
            echo "ERROR: Missing input files for direct domain diff" >&2
            exit 1
          fi
          if [ -f "./proxy-list-deleted-sort" ] && [ -f "./proxy-list-with-redundant" ]; then
            diff ./proxy-list-deleted-sort ./proxy-list-with-redundant | awk '/^>/{print $2}' > ./proxy-list-without-redundant || {
              # If diff fails or produces no output, use the original file
              cp ./proxy-list-with-redundant ./proxy-list-without-redundant || {
                echo "ERROR: Failed to create proxy-list-without-redundant" >&2
                exit 1
              }
            }
          else
            echo "ERROR: Missing input files for proxy domain diff" >&2
            exit 1
          fi
          if [ -f "./reject-list-deleted-sort" ] && [ -f "./reject-list-with-redundant" ]; then
            diff ./reject-list-deleted-sort ./reject-list-with-redundant | awk '/^>/{print $2}' > ./reject-list-without-redundant || {
              # If diff fails or produces no output, use the original file
              cp ./reject-list-with-redundant ./reject-list-without-redundant || {
                echo "ERROR: Failed to create reject-list-without-redundant" >&2
                exit 1
              }
            }
          else
            echo "ERROR: Missing input files for reject domain diff" >&2
            exit 1
          fi

           # Apply hidden branch removals
           if [ -f "${{ inputs.hidden-data-dir }}/direct-need-to-remove.txt" ]; then
             if [ -f ./direct-list-without-redundant ]; then
               # Perform diff to exclude domains that need to be removed
               diff "${{ inputs.hidden-data-dir }}/direct-need-to-remove.txt" ./direct-list-without-redundant | awk '/^>/{print $2}' > temp-cn.txt || {
                 # If diff fails, try alternative approach: filter out domains that exist in the removal list
                 echo "Warning: Diff failed, using alternative approach for direct domains" >&2
                 comm -23 <(sort ./direct-list-without-redundant) <(sort "${{ inputs.hidden-data-dir }}/direct-need-to-remove.txt") > temp-cn.txt || {
                   # If alternative also fails, copy original file
                   cp ./direct-list-without-redundant temp-cn.txt || {
                     echo "ERROR: Failed to apply hidden branch removals for direct domains" >&2
                     exit 1
                   }
                 }
               }
             else
               cp ./direct-list-without-redundant temp-cn.txt || {
                 echo "ERROR: Failed to copy direct-list-without-redundant to temp-cn.txt" >&2
                 exit 1
               }
             fi
           else
             cp ./direct-list-without-redundant temp-cn.txt || {
               echo "ERROR: Failed to copy direct-list-without-redundant to temp-cn.txt" >&2
               exit 1
             }
           fi
           if [ -f "${{ inputs.hidden-data-dir }}/proxy-need-to-remove.txt" ]; then
             if [ -f ./proxy-list-without-redundant ]; then
               # Perform diff to exclude domains that need to be removed
               diff "${{ inputs.hidden-data-dir }}/proxy-need-to-remove.txt" ./proxy-list-without-redundant | awk '/^>/{print $2}' > temp-geolocation-\!cn.txt || {
                 # If diff fails, try alternative approach: filter out domains that exist in the removal list
                 echo "Warning: Diff failed, using alternative approach for proxy domains" >&2
                 comm -23 <(sort ./proxy-list-without-redundant) <(sort "${{ inputs.hidden-data-dir }}/proxy-need-to-remove.txt") > temp-geolocation-\!cn.txt || {
                   # If alternative also fails, copy original file
                   cp ./proxy-list-without-redundant temp-geolocation-\!cn.txt || {
                     echo "ERROR: Failed to apply hidden branch removals for proxy domains" >&2
                     exit 1
                   }
                 }
               }
             else
               cp ./proxy-list-without-redundant temp-geolocation-\!cn.txt || {
                 echo "ERROR: Failed to copy proxy-list-without-redundant to temp-geolocation-\!cn.txt" >&2
                 exit 1
               }
             fi
           else
             cp ./proxy-list-without-redundant temp-geolocation-\!cn.txt || {
               echo "ERROR: Failed to copy proxy-list-without-redundant to temp-geolocation-\!cn.txt" >&2
               exit 1
             }
           fi
           if [ -f "${{ inputs.hidden-data-dir }}/reject-need-to-remove.txt" ]; then
             if [ -f ./reject-list-without-redundant ]; then
               # Perform diff to exclude domains that need to be removed
               diff "${{ inputs.hidden-data-dir }}/reject-need-to-remove.txt" ./reject-list-without-redundant | awk '/^>/{print $2}' > temp-category-ads-all.txt || {
                 # If diff fails, try alternative approach: filter out domains that exist in the removal list
                 echo "Warning: Diff failed, using alternative approach for reject domains" >&2
                 comm -23 <(sort ./reject-list-without-redundant) <(sort "${{ inputs.hidden-data-dir }}/reject-need-to-remove.txt") > temp-category-ads-all.txt || {
                   # If alternative also fails, copy original file
                   cp ./reject-list-without-redundant temp-category-ads-all.txt || {
                     echo "ERROR: Failed to apply hidden branch removals for reject domains" >&2
                     exit 1
                   }
                 }
               }
             else
               cp ./reject-list-without-redundant temp-category-ads-all.txt || {
                 echo "ERROR: Failed to copy reject-list-without-redundant to temp-category-ads-all.txt" >&2
                 exit 1
               }
             fi
           else
             cp ./reject-list-without-redundant temp-category-ads-all.txt || {
               echo "ERROR: Failed to copy reject-list-without-redundant to temp-category-ads-all.txt" >&2
               exit 1
             }
           fi

    - id: finalize
      name: Finalize domain lists
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        if [[ ! -f "${{ github.workspace }}/.github/scripts/common.sh" ]]; then
          echo "ERROR: Common functions file not found at ${{ github.workspace }}/.github/scripts/common.sh" >&2
          exit 1
        fi
        source "${{ github.workspace }}/.github/scripts/common.sh"
        
        # Validate working directory exists
        WORK_DIR="${{ inputs.work-dir }}"
        if [[ ! -d "$WORK_DIR" ]]; then
          echo "ERROR: Working directory '$WORK_DIR' does not exist" >&2
          exit 1
        fi
        cd "$WORK_DIR"

         # Finalize domain lists
         mkdir -p "$CUSTOM_DATA_DIR" || {
           echo "ERROR: Failed to create custom data directory" >&2
           exit 1
         }
         filter_valid_domains "temp-cn.txt" "${CUSTOM_DATA_DIR}/cn" || {
           echo "ERROR: Failed to filter valid domains for cn" >&2
           exit 1
         }
         filter_valid_fqdn "temp-cn.txt" "direct-tld-list.txt" || {
           echo "ERROR: Failed to filter valid FQDN for direct-tld-list" >&2
           exit 1
         }
         filter_valid_domains "temp-geolocation-\!cn.txt" "${CUSTOM_DATA_DIR}/geolocation-\!cn" || {
           echo "ERROR: Failed to filter valid domains for geolocation-\!cn" >&2
           exit 1
         }
         filter_not_cn_tld "temp-geolocation-\!cn.txt" "proxy-tld-list.txt" || {
           echo "ERROR: Failed to filter non-CN TLD for proxy-tld-list" >&2
           exit 1
         }
         filter_valid_domains "temp-category-ads-all.txt" "${CUSTOM_DATA_DIR}/category-ads-all" || {
           echo "ERROR: Failed to filter valid domains for category-ads-all" >&2
           exit 1
         }
         filter_valid_fqdn "temp-category-ads-all.txt" "reject-tld-list.txt" || {
           echo "ERROR: Failed to filter valid FQDN for reject-tld-list" >&2
           exit 1
         }

         # Add reserved rules back
         for item in $(jq -c '.sources.direct.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json" 2>/dev/null); do
           name=$(echo "$item" | tr -d '"')
           if [ -f "${name}-reserve.txt" ]; then
             cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/cn" || {
               echo "ERROR: Failed to add reserved rules for direct source $name" >&2
               exit 1
             }
           fi
         done || {
           echo "ERROR: Failed to parse direct sources for reserved rules" >&2
           exit 1
         }

         for item in $(jq -c '.sources.proxy.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json" 2>/dev/null); do
           name=$(echo "$item" | tr -d '"')
           if [ -f "${name}-reserve.txt" ]; then
             cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/geolocation-\!cn" || {
               echo "ERROR: Failed to add reserved rules for proxy source $name" >&2
               exit 1
             }
           fi
         done || {
           echo "ERROR: Failed to parse proxy sources for reserved rules" >&2
           exit 1
         }

         # Add any reject reserve rules (though none exist in current config)
         for item in $(jq -c '.sources.reject.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json" 2>/dev/null); do
           name=$(echo "$item" | tr -d '"')
           if [ -f "${name}-reserve.txt" ]; then
             cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/category-ads-all" || {
               echo "ERROR: Failed to add reserved rules for reject source $name" >&2
               exit 1
             }
           fi
         done || {
           echo "ERROR: Failed to parse reject sources for reserved rules" >&2
           exit 1
         }

         cp "${CUSTOM_DATA_DIR}/cn" direct-list.txt || {
           echo "ERROR: Failed to copy cn to direct-list.txt" >&2
           exit 1
         }
         cp "${CUSTOM_DATA_DIR}/geolocation-\!cn" proxy-list.txt || {
           echo "ERROR: Failed to copy geolocation-\!cn to proxy-list.txt" >&2
           exit 1
         }
         cp "${CUSTOM_DATA_DIR}/category-ads-all" reject-list.txt || {
           echo "ERROR: Failed to copy category-ads-all to reject-list.txt" >&2
           exit 1
         }

        # Set output counts
        echo "direct-count=$(count_lines direct-list.txt)" >> "$GITHUB_OUTPUT"
        echo "proxy-count=$(count_lines proxy-list.txt)" >> "$GITHUB_OUTPUT"
        echo "reject-count=$(count_lines reject-list.txt)" >> "$GITHUB_OUTPUT"