name: Download and Process Sources
description: Download domain lists and process them into final lists

inputs:
  config-dir:
    description: Directory containing sources.json config
    required: false
    default: ${{ github.workspace }}/.github/config
  work-dir:
    description: Working directory for processing
    required: false
    default: ${{ github.workspace }}
  custom-data-dir:
    description: Path to domain-list-community data directory
    required: false
    default: ${{ github.workspace }}/community/data
  hidden-data-dir:
    description: Path to hidden branch data directory
    required: false
    default: ${{ github.workspace }}/hidden-data

outputs:
  direct-count:
    description: Final count of direct domains
    value: ${{ steps.process.outputs.direct-count }}
  proxy-count:
    description: Final count of proxy domains
    value: ${{ steps.process.outputs.proxy-count }}
  reject-count:
    description: Final count of reject domains
    value: ${{ steps.process.outputs.reject-count }}

runs:
  using: composite
  steps:
    - name: Load common functions
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        source "${{ github.workspace }}/.github/scripts/common.sh" || true

    - id: download-sources
      name: Download all sources
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        source "${{ github.workspace }}/.github/scripts/common.sh"
        OUTPUT_DIR="${{ inputs.work-dir }}"
        CONFIG_DIR="${{ inputs.config-dir }}"

        cd "$OUTPUT_DIR"

        # Download all sources dynamically from JSON config
        # Group by category to process them together

        # Process direct sources
        while IFS= read -r line; do
          url=$(echo "$line" | jq -r '.url')
          name=$(echo "$line" | jq -r '.name')
          output=$(echo "$line" | jq -r '.output')
          format=$(echo "$line" | jq -r '.format')

          case "$format" in
            "gfwlist")
              # Special handling for gfwlist since it requires local setup
              if [ -d "gfwlist2dnsmasq" ]; then
                setup_gfwlist "gfwlist2dnsmasq" "$output"
              else
                echo "Warning: gfwlist2dnsmasq directory not found for $name" >&2
              fi
              ;;
            *)
              curl_download "$url" "temp-$name.txt"
              ;;
          esac
        done < <(jq -c '.sources.direct.items[]' "${CONFIG_DIR}/sources.json")

        # Process proxy sources
        while IFS= read -r line; do
          url=$(echo "$line" | jq -r '.url')
          name=$(echo "$line" | jq -r '.name')
          output=$(echo "$line" | jq -r '.output')

          curl_download "$url" "temp-$name.txt"
        done < <(jq -c '.sources.proxy.items[]' "${CONFIG_DIR}/sources.json")

        # Process reject sources
        while IFS= read -r line; do
          url=$(echo "$line" | jq -r '.url')
          name=$(echo "$line" | jq -r '.name')
          output=$(echo "$line" | jq -r '.output')

          curl_download "$url" "temp-$name.txt"
        done < <(jq -c '.sources.reject.items[]' "${CONFIG_DIR}/sources.json")

        # Process additional sources
        while IFS= read -r line; do
          url=$(echo "$line" | jq -r '.url')
          name=$(echo "$line" | jq -r '.name')
          output=$(echo "$line" | jq -r '.output')

          # For additional sources, use curl_download to match behavior with other sources
          curl_download "$url" "$output"
        done < <(jq -c '.sources.additional.items[]' "${CONFIG_DIR}/sources.json")

    - id: process-domains
      name: Process and extract domains
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        source "${{ github.workspace }}/.github/scripts/common.sh"
        WORK_DIR="${{ inputs.work-dir }}"
        cd "$WORK_DIR"

        # Process all direct sources into their respective output files
        declare -A direct_processed_outputs
        while IFS= read -r line; do
          name=$(echo "$line" | jq -r '.name')
          format=$(echo "$line" | jq -r '.format')
          output=$(echo "$line" | jq -r '.output')

          # Check if we already processed this output file
          if [[ -z "${direct_processed_outputs[$output]:-}" ]]; then
            # Clear the output file if it exists
            > "$output"
            direct_processed_outputs["$output"]=1
          fi

          case "$format" in
            "dnsmasq")
              extract_dnsmasq_domains "temp-$name.txt" "$output"
              ;;
            "domain-list-custom")
              extract_domain_list_custom "temp-$name.txt" "$output" "false"
              ;;
            *)
              echo "Unknown format '$format' for $name" >&2
              ;;
          esac
        done < <(jq -c '.sources.direct.items[]' "${{ inputs.config-dir }}/sources.json")

        # Process all proxy sources into their respective output files
        declare -A proxy_processed_outputs
        while IFS= read -r line; do
          name=$(echo "$line" | jq -r '.name')
          format=$(echo "$line" | jq -r '.format')
          output=$(echo "$line" | jq -r '.output')

          # Check if we already processed this output file
          if [[ -z "${proxy_processed_outputs[$output]:-}" ]]; then
            # Clear the output file if it exists
            > "$output"
            proxy_processed_outputs["$output"]=1
          fi

          case "$format" in
            "dnsmasq")
              extract_dnsmasq_domains "temp-$name.txt" "$output"
              ;;
            "domain-list-custom")
              extract_domain_list_custom "temp-$name.txt" "$output" "true"
              ;;
            "plain")
              extract_plain_domains "temp-$name.txt" "$output"
              ;;
            "gfwlist")
              filter_valid_fqdn "temp-$name.txt" "$output"
              ;;
            *)
              echo "Unknown format '$format' for $name" >&2
              ;;
          esac
        done < <(jq -c '.sources.proxy.items[]' "${{ inputs.config-dir }}/sources.json")

        # Process all reject sources into their respective output files
        declare -A reject_processed_outputs
        while IFS= read -r line; do
          name=$(echo "$line" | jq -r '.name')
          format=$(echo "$line" | jq -r '.format')
          output=$(echo "$line" | jq -r '.output')

          # Check if we already processed this output file
          if [[ -z "${reject_processed_outputs[$output]:-}" ]]; then
            # Clear the output file if it exists
            > "$output"
            reject_processed_outputs["$output"]=1
          fi

          case "$format" in
            "abp")
              extract_abp_domains "temp-$name.txt" "$output"
              ;;
            "hosts")
              extract_hosts_domains "temp-$name.txt" "$output"
              ;;
            "plain")
              cp "temp-$name.txt" "$output"
              ;;
            "wildcard")
              extract_wildcard_domains "temp-$name.txt" "$output"
              ;;
            *)
              echo "Unknown format '$format' for $name" >&2
              ;;
          esac
        done < <(jq -c '.sources.reject.items[]' "${{ inputs.config-dir }}/sources.json")

        # Extract reserved rules for domain-list-custom sources in direct/proxy
        declare -A direct_reserve_processed
        while IFS= read -r line; do
          name=$(echo "$line" | jq -r '.name')
          format=$(echo "$line" | jq -r '.format')

          case "$format" in
            "domain-list-custom")
              if [[ -z "${direct_reserve_processed[$name]:-}" ]]; then
                extract_domain_list_custom_reserved "temp-$name.txt" "${name}-reserve.txt" "false"
                direct_reserve_processed["$name"]=1
              fi
              ;;
          esac
        done < <(jq -c '.sources.direct.items[]' "${{ inputs.config-dir }}/sources.json")

        declare -A proxy_reserve_processed
        while IFS= read -r line; do
          name=$(echo "$line" | jq -r '.name')
          format=$(echo "$line" | jq -r '.format')

          case "$format" in
            "domain-list-custom")
              if [[ -z "${proxy_reserve_processed[$name]:-}" ]]; then
                extract_domain_list_custom_reserved "temp-$name.txt" "${name}-reserve.txt" "true"
                proxy_reserve_processed["$name"]=1
              fi
              ;;
          esac
        done < <(jq -c '.sources.proxy.items[]' "${{ inputs.config-dir }}/sources.json")

    - id: deduplicate
      name: Remove redundant domains
      shell: bash
      run: |
        # shellcheck source=.github/scripts/common.sh
        source "${{ github.workspace }}/.github/scripts/common.sh"
        WORK_DIR="${{ inputs.work-dir }}"
        CUSTOM_DATA_DIR="${{ inputs.custom-data-dir }}"
        cd "$WORK_DIR"

         # Merge hidden branch overrides
         if [ -f "${{ inputs.hidden-data-dir }}/proxy.txt" ]; then cat "${{ inputs.hidden-data-dir }}/proxy.txt" >> "temp-proxy.txt"; fi
         if [ -f "${{ inputs.hidden-data-dir }}/direct.txt" ]; then cat "${{ inputs.hidden-data-dir }}/direct.txt" >> "temp-direct.txt"; fi
         if [ -f "${{ inputs.hidden-data-dir }}/reject.txt" ]; then cat "${{ inputs.hidden-data-dir }}/reject.txt" >> "temp-reject.txt"; fi

        # Sort and deduplicate
        sort_unique "temp-proxy.txt" "proxy-list-with-redundant"
        sort_unique "temp-direct.txt" "direct-list-with-redundant"
        sort_unique "temp-reject.txt" "reject-list-with-redundant"

        # Remove redundant domains
        if [ -f "${{inputs.hidden-data-dir}}/findRedundantDomain.py" ]; then
          cp "${{inputs.hidden-data-dir}}/findRedundantDomain.py" .
          chmod +x findRedundantDomain.py
        fi
        ./findRedundantDomain.py ./direct-list-with-redundant ./direct-list-deleted-unsort
        ./findRedundantDomain.py ./proxy-list-with-redundant ./proxy-list-deleted-unsort
        ./findRedundantDomain.py ./reject-list-with-redundant ./reject-list-deleted-unsort

        [ ! -f "direct-list-deleted-unsort" ] && touch direct-list-deleted-unsort
        [ ! -f "proxy-list-deleted-unsort" ] && touch proxy-list-deleted-unsort
        [ ! -f "reject-list-deleted-unsort" ] && touch reject-list-deleted-unsort

        sort ./direct-list-deleted-unsort > ./direct-list-deleted-sort
        sort ./proxy-list-deleted-unsort > ./proxy-list-deleted-sort
        sort ./reject-list-deleted-unsort > ./reject-list-deleted-sort

        diff ./direct-list-deleted-sort ./direct-list-with-redundant | awk '/^>/{print $2}' > ./direct-list-without-redundant
        diff ./proxy-list-deleted-sort ./proxy-list-with-redundant | awk '/^>/{print $2}' > ./proxy-list-without-redundant
        diff ./reject-list-deleted-sort ./reject-list-with-redundant | awk '/^>/{print $2}' > ./reject-list-without-redundant

         # Apply hidden branch removals
         if [ -f "${{ inputs.hidden-data-dir }}/direct-need-to-remove.txt" ]; then
           diff "${{ inputs.hidden-data-dir }}/direct-need-to-remove.txt" ./direct-list-without-redundant | awk '/^>/{print $2}' > temp-cn.txt
         else
           cp ./direct-list-without-redundant temp-cn.txt
         fi
         if [ -f "${{ inputs.hidden-data-dir }}/proxy-need-to-remove.txt" ]; then
           diff "${{ inputs.hidden-data-dir }}/proxy-need-to-remove.txt" ./proxy-list-without-redundant | awk '/^>/{print $2}' > temp-geolocation-\!cn.txt
         else
           cp ./proxy-list-without-redundant temp-geolocation-\!cn.txt
         fi
         if [ -f "${{ inputs.hidden-data-dir }}/reject-need-to-remove.txt" ]; then
           diff "${{ inputs.hidden-data-dir }}/reject-need-to-remove.txt" ./reject-list-without-redundant | awk '/^>/{print $2}' > temp-category-ads-all.txt
         else
           cp ./reject-list-without-redundant temp-category-ads-all.txt
         fi

        # Finalize domain lists
        mkdir -p "$CUSTOM_DATA_DIR"
        filter_valid_domains "temp-cn.txt" "${CUSTOM_DATA_DIR}/cn"
        filter_valid_fqdn "temp-cn.txt" "direct-tld-list.txt"
        filter_valid_domains "temp-geolocation-\!cn.txt" "${CUSTOM_DATA_DIR}/geolocation-\!cn"
        filter_not_cn_tld "temp-geolocation-\!cn.txt" "proxy-tld-list.txt"
        filter_valid_domains "temp-category-ads-all.txt" "${CUSTOM_DATA_DIR}/category-ads-all"
        filter_valid_fqdn "temp-category-ads-all.txt" "reject-tld-list.txt"

        # Add reserved rules back
        for item in $(jq -c '.sources.direct.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json"); do
          name=$(echo "$item" | tr -d '"')
          if [ -f "${name}-reserve.txt" ]; then
            cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/cn"
          fi
        done

        for item in $(jq -c '.sources.proxy.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json"); do
          name=$(echo "$item" | tr -d '"')
          if [ -f "${name}-reserve.txt" ]; then
            cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/geolocation-\!cn"
          fi
        done

        # Add any reject reserve rules (though none exist in current config)
        for item in $(jq -c '.sources.reject.items[] | select(.format == "domain-list-custom") | .name' "${{ inputs.config-dir }}/sources.json"); do
          name=$(echo "$item" | tr -d '"')
          if [ -f "${name}-reserve.txt" ]; then
            cat "${name}-reserve.txt" >> "${CUSTOM_DATA_DIR}/category-ads-all"
          fi
        done

        cp "${CUSTOM_DATA_DIR}/cn" direct-list.txt
        cp "${CUSTOM_DATA_DIR}/geolocation-\!cn" proxy-list.txt
        cp "${CUSTOM_DATA_DIR}/category-ads-all" reject-list.txt

        # Set output counts
        echo "direct-count=$(count_lines direct-list.txt)" >> "$GITHUB_OUTPUT"
        echo "proxy-count=$(count_lines proxy-list.txt)" >> "$GITHUB_OUTPUT"
        echo "reject-count=$(count_lines reject-list.txt)" >> "$GITHUB_OUTPUT"

    - name: Summary
      shell: bash
      run: |
        echo "## Download and Process Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Direct domains: ${{ steps.deduplicate.outputs.direct-count }}" >> $GITHUB_STEP_SUMMARY
        echo "- Proxy domains: ${{ steps.deduplicate.outputs.proxy-count }}" >> $GITHUB_STEP_SUMMARY
        echo "- Reject domains: ${{ steps.deduplicate.outputs.reject-count }}" >> $GITHUB_STEP_SUMMARY
