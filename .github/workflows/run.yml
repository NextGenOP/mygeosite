name: Build V2Ray rules dat files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for workflow and actions)
        uses: actions/checkout@v6

      - name: Checkout hidden branch (for data files)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: hidden
          path: hidden-data

      - name: Checkout domain-list-custom
        uses: actions/checkout@v6
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - name: Checkout domain-list-community
        uses: actions/checkout@v6
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout gfwlist2dnsmasq
        uses: actions/checkout@v6
        with:
          repository: cokebar/gfwlist2dnsmasq
          path: gfwlist2dnsmasq

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Set release variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Download and Process Sources
        uses: ./.github/actions/download-and-process
        with:
          config-dir: ${{ github.workspace }}/.github/config
          work-dir: ${{ github.workspace }}
          custom-data-dir: ${{ github.workspace }}/community/data
          hidden-data-dir: ${{ github.workspace }}/hidden-data

      - name: Build and Release
        uses: ./.github/actions/build-release
        with:
          config-dir: ${{ github.workspace }}/.github/config
          work-dir: ${{ github.workspace }}
          custom-dir: ${{ github.workspace }}/custom
          community-dir: ${{ github.workspace }}/community
          release-name: ${{ env.RELEASE_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hidden-data-dir: ${{ github.workspace }}/hidden-data
